# Compila GULA para Windows y macOS y publica un Release en GitHub con
# los instaladores + latest.json (para el actualizador automático).
#
# Se dispara al subir un tag "v*":   git tag v0.2.0 && git push origin v0.2.0
# También se puede correr a mano desde la pestaña Actions.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest      # Apple Silicon (M1/M2/M3/M4)
            args: "--target aarch64-apple-darwin"
          - platform: macos-15-intel    # Intel (macos-13 fue retirado por GitHub)
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "GULA ${{ github.ref_name }}"
          releaseBody: "Instaladores: Windows (.exe), macOS Apple Silicon y macOS Intel (.dmg). En Mac, la primera vez: clic derecho → Abrir."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
